name: CI

on:
  push:
    branches: [main]
  # Include stacked PRs so each layer is tested before its base merges.
  pull_request:
  workflow_dispatch:
    inputs:
      published_framework:
        description: Verify a tagged Roost release with every app dependency from GitHub
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  published-dependencies:
    if: ${{ !inputs.published_framework }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the macOS SDK
        if: runner.os == 'macOS'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Import Swift signing keys
        if: runner.os == 'Linux'
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Test against published dependency versions
        run: swift test

  valkey-store:
    if: ${{ !inputs.published_framework }}
    runs-on: ubuntu-24.04
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VALKEY_URL: valkey://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Test the key-value store and PubSub against Valkey
        run: swift test --traits Valkey

  # Runs ScopedRepo's SQL and the example's migrations against a real database.
  example-app:
    if: ${{ !inputs.published_framework }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roost_example
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROOST_FRAMEWORK_PATH: ${{ github.workspace }}
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: roost_example
    defaults:
      run:
        working-directory: examples/Roost
    steps:
      - uses: actions/checkout@v4
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build the example against this checkout
        run: swift build --product RoostExample
      - name: Apply the example's migrations
        run: '"$(swift build --show-bin-path)/RoostExample" migrate up'
      - name: Test the example
        run: swift test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test tools
        run: |
          npm ci --prefix BrowserTests
          npx --prefix BrowserTests playwright install --with-deps chromium
      - name: Test live bookmarks in a browser
        run: npm test --prefix BrowserTests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-bookmarks-browser
          path: examples/Roost/BrowserTests/artifacts/
          if-no-files-found: ignore

  generated-app:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # A change that needs the CLI too has a roost-cli branch of the same name.
      - name: Choose the roost CLI branch
        id: cli
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/roost-framework/roost-cli.git "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the roost CLI
        uses: actions/checkout@v4
        with:
          repository: roost-framework/roost-cli
          ref: ${{ steps.cli.outputs.ref }}
          path: roost-cli
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed --retry 3 https://www.swift.org/keys/all-keys.asc | gpg --batch --import
      - uses: swift-actions/setup-swift@364295d9c23900ce04d4e5cc708387921b4e50f9 # v3, Swiftly-backed installer
        with:
          swift-version: "6.3.3"
      - name: Install PostgreSQL client tools and system dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql-client zlib1g-dev
      - name: Exercise generated app with published companion packages
        if: ${{ !inputs.published_framework }}
        run: python3 roost-cli/scripts/check_generated_app.py --framework "$GITHUB_WORKSPACE" --release --work-dir "$RUNNER_TEMP/roost-acceptance"
      - name: Exercise released Roost with every dependency from GitHub
        if: ${{ inputs.published_framework }}
        run: python3 roost-cli/scripts/check_generated_app.py --published-framework --release --work-dir "$RUNNER_TEMP/roost-acceptance"
      - name: Keep acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-logs
          path: ${{ runner.temp }}/roost-acceptance/*.log
